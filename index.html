```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <title>Tràn bộ nhớ</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <h1>Anh có điều muốn nói</h1>

  <button id="playButton" onclick="generateRandomNotifications()">
    Nhấn đây nè
  </button>

  <div class="final-message" id="finalMessage" onclick="redirectToNewPage()">
    <p id="text1"></p>
    <p id="text2"></p>
  </div>

  <!-- Nhạc Tràn bộ nhớ -->
  <audio id="audioPlayer" src="./TBN.mp3" preload="auto"></audio>

  <script>
    const playButton = document.getElementById("playButton");
    const audioPlayer = document.getElementById("audioPlayer");

    // Bấm nút thì phát nhạc
    playButton.addEventListener("click", function () {
      audioPlayer.play().catch(function (error) {
        console.log("Không thể phát nhạc:", error);
      });
    });

    // Bấm/chạm bất kỳ vị trí nào trên màn hình thì phát nhạc
    document.addEventListener("click", function () {
      if (audioPlayer.paused) {
        audioPlayer.play().catch(function (error) {
          console.log("Không thể phát nhạc:", error);
        });
      }
    });

    // Hỗ trợ chạm trên điện thoại
    document.addEventListener("touchstart", function () {
      if (audioPlayer.paused) {
        audioPlayer.play().catch(function (error) {
          console.log("Không thể phát nhạc:", error);
        });
      }
    }, { passive: true });
  </script>

  <script src="./script.js"></script>

</body>

</html>
```
